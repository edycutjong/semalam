<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SEMALAM — a paper stall ticket hanging from a lit lamp; its stamp is a ring split dusk blue (sealed) to amber (settled)">
<title>SEMALAM</title>
<defs>
  <radialGradient id="mlamp" cx="50%" cy="45%" r="50%"><stop offset="0" stop-color="#FFF6DE"/><stop offset=".45" stop-color="#FFB547"/><stop offset="1" stop-color="#E08A1E"/></radialGradient>
  <radialGradient id="mhalo"><stop offset="0" stop-color="#FFB547" stop-opacity=".55"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
  <mask id="mnotch"><rect x="-200" y="-40" width="400" height="380" fill="#fff"/><circle cx="-150" cy="228" r="24" fill="#000"/><circle cx="150" cy="228" r="24" fill="#000"/></mask>
  <filter id="mdrop" x="-30%" y="-20%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4DC"/><stop offset="1" stop-color="#EBD9B4"/></linearGradient>
  <radialGradient id="sky" cx="50%" cy="18%" r="75%"><stop offset="0" stop-color="#FFB547" stop-opacity=".3"/><stop offset=".45" stop-color="#7C8CC4" stop-opacity=".1"/><stop offset="1" stop-color="#1B1530" stop-opacity="0"/></radialGradient>
</defs>
<rect width="512" height="512" rx="112" fill="#1B1530"/>
<rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <path d="M 20 60 Q 256 140 492 60" fill="none" stroke="#6A5A92" stroke-width="7" stroke-linecap="round"/>
  <circle cx="256" cy="138" r="84" fill="url(#mhalo)"></circle>
  <rect x="240" y="94" width="32" height="16" rx="4" fill="#3A2F55"/>
  <circle cx="256" cy="138" r="31" fill="url(#mlamp)"></circle>
  <g transform="translate(256 172) rotate(-6)">
    <line x1="0" y1="-6" x2="0" y2="16" stroke="#6A5A92" stroke-width="5" stroke-linecap="round"/>
    <g filter="url(#mdrop)"><rect x="-150" y="12" width="300" height="284" rx="20" fill="url(#paper)" mask="url(#mnotch)"/></g>
    <circle cx="0" cy="32" r="8" fill="#1B1530"/>
    <line x1="-124" y1="228" x2="124" y2="228" stroke="#2A2140" stroke-width="4" stroke-dasharray="10 9" opacity=".35"/>
    <rect x="-90" y="248" width="112" height="11" rx="5.5" fill="#2A2140" opacity=".28"/>
    <rect x="40" y="248" width="50" height="11" rx="5.5" fill="#2A2140" opacity=".28"/>
    <g transform="translate(0 134) rotate(-12)">
      <circle r="50" fill="none" stroke="#2A2140" stroke-width="4" opacity=".3"/>
      <circle r="76" transform="rotate(90)" pathLength="100" fill="none" stroke="#4E5C9A" stroke-width="19" stroke-linecap="butt" stroke-dasharray="45 155" stroke-dashoffset="-2.5"/>
      
      <circle r="76" transform="rotate(-90)" pathLength="100" fill="none" stroke="#B5650A" stroke-width="19" stroke-linecap="butt" stroke-dasharray="45 155" stroke-dashoffset="-2.5"/>
      <circle r="24" fill="#4E5C9A" opacity=".3"/>
      <circle r="24" fill="url(#mlamp)"></circle>
    </g>
  </g>
</svg>
