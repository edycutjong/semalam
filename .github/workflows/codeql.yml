name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      # Code scanning uploads need the repo public (no Advanced Security on private); until the flip the SARIF is an artifact.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif
      - if: github.event.repository.private
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: sarif
          retention-days: 7
