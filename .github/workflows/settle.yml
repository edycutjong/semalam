# Nightly settle: replays every closed round that has no Results.Posted yet (oldest first), posts only when the runner's
# hash equals the bundled CLI's hash computed in a fresh process, then commits apps/web/data/rounds/<n>.json.
# 17:00 UTC is the close (00:00 WIB); the seed beacon exists 300 s later, so the dense polling window is 17:05-20:00.
name: settle
on:
  schedule:
    - cron: "5-59/5 17 * * *"
    - cron: "*/5 18-19 * * *"
    - cron: "17 20-23,0-16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: settle
jobs:
  settle:
    runs-on: ubuntu-latest
    env:
      POSTER_PRIVATE_KEY: ${{ secrets.POSTER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter semalam build
      - name: settle every closed round that lacks a post (chain 4663)
        run: pnpm --filter @semalam/scripts exec tsx settle/settle.ts --chain 4663
      - name: settle the testnet rounds the nightly bot playtest fills (chain 46630)
        if: always()
        run: pnpm --filter @semalam/scripts exec tsx settle/settle.ts --chain 46630
      - name: commit round artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apps/web/data/rounds
          git diff --cached --quiet || (git commit -m "settle: round artifacts" && git pull --rebase --autostash && git push)
