<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SEMALAM — the night market your agent plays while you sleep: a paper stall ticket, stamped SEALED in dusk blue at 23:58, re-stamped amber: SETTLED · 4th of N — here the real 4th of 30 on testnet night 1, replayed by the real simulator.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur). No text at all.
  0-8%    steady state: the static icon — lit lamp, ticket stamped with the amber SETTLED ring (poster rule)
  8-22%   trigger:      23:58 — the amber ring lifts off, the lamp dims, the dusk-blue SEALED box stamp slams down     data-story="beat-2"
  22-56%  mechanism:    A paper stall ticket, stamped SEALED in dusk blue at 23:58, re-stamped amber: SETTLED · 4th of N.
                        (the market plays: ▲ gather · ■ guard · ◆ share · ✕ steal spark along the lamp string,
                        side lamps flicker)                                                                             data-story="beat-3"
  56-80%  resolution:   the amber ring slams back over the blue box (it fades under), the lamp re-lights with a flare
  80-100% breathe: halo breath; 100% == 0% (settled) so the seam never cuts
-->
<style>
  .drift-a { animation: drift-a 17s ease-in-out infinite alternate; }
  .drift-b { animation: drift-b 14s ease-in-out infinite alternate; }
  @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(-90px, 24px); } }
  @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(110px, -18px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
